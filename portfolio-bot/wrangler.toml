# Настройки выкладки на Cloudflare Workers. Выкладывает GitHub (.github/workflows/portfolio-bot.yml).
name = "portfolio-bot"
main = "worker.js"
compatibility_date = "2026-10-01"

# Картинки из папки images (имя файла указывается в data.json, поле image).
[assets]
directory = "./images"
binding = "ASSETS"

# Владелец бота по Telegram ID (через запятую, если несколько). Ники в data.json тогда не используются.
[vars]
OWNER_ID = "8301728829"

# Память бота: кто владелец, кому отвечать, загруженные картинки.
# id подставляет workflow при выкладке.
[[kv_namespaces]]
binding = "STATE"
id = "KV_ID"

# Таймер: запускает в GitHub ролики и поиск заказов (scheduled в worker.js).
[triggers]
crons = ["5 8-19 * * *", "17 5-20 * * *"]
