name: Voice samples

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --upgrade edge-tts gTTS && pip show edge-tts | head -2
      - run: python tools/voice_samples.py samples
      - name: Сохранить в ветку samples
        run: |
          git config user.name "shorts-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan samples
          git rm -rqf --cached .
          git add samples
          git commit -qm "Примеры голосов"
          git push -f origin samples
