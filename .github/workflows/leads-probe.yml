name: leads-probe
on:
  push:
    branches: [claude/project-thread-totfaf]
    paths: [leads/probe/**]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q requests beautifulsoup4
      - run: python -u leads/probe/who.py $(cat leads/probe/list.txt)
