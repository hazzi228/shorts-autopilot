name: leads-probe
on:
  push:
    branches: [claude/project-thread-totfaf]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q requests beautifulsoup4
      - run: echo '{}' > leads/seen.json && python -u leads/finder.py --dry-run --days 7 | grep -E 'просмотрено|пропущена|Ниша|^🤖|^🌐|Traceback|Error'
