name: Сайт Neznal

# Выкладывает сайт приложения Neznal на Cloudflare Workers (neznal.<имя>.workers.dev).
on:
  push:
    branches: [main]
    paths: ["neznal-site/**", ".github/workflows/neznal-site.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: neznal-site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Выложить
        run: |
          npx --yes wrangler@4.148.0 deploy || { sleep 5; npx --yes wrangler@4.148.0 deploy; }
          sub=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['result']['subdomain'])")
          url="https://neznal.$sub.workers.dev"
          sleep 10
          curl -sS "$url/" | grep -o "<title>[^<]*</title>"
          echo "Сайт: $url" | tee -a "$GITHUB_STEP_SUMMARY"
