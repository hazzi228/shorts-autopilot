name: Instagram diagnostics

on:
  workflow_dispatch:
    inputs:
      id:
        description: "id сценария"
        required: true

permissions:
  contents: read

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Голос из кэша
        uses: actions/cache@v5
        with:
          path: voice
          key: voice-dmitri-medium-v1
      - name: Диагностика
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          IG_KEY: ${{ secrets.IG_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCENARIO: ${{ inputs.id }}
        run: python -u tools/ig_diag.py
