name: Поиск клиентов

on:
  schedule:
    # Каждый час с 8:00 до 23:00 по Москве (UTC+3).
    - cron: "17 5-20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leads
  cancel-in-progress: false

jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Библиотеки
        run: pip install -q requests beautifulsoup4

      - name: Найти заявки и прислать в Telegram
        env:
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          LEADS_CHAT_ID: ${{ secrets.LEADS_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u leads/finder.py

      - name: Запомнить, что уже прислано
        if: always()
        run: |
          git config user.name "shorts-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add leads/seen.json leads/log.txt
          git diff --cached --quiet && exit 0
          git commit -m "Заявки $(date -u +%F\ %H:%M) UTC"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
