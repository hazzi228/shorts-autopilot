name: Instagram check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install requests
      - name: Проверить ключ и сохранить бессрочный ключ страницы
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          IG_KEY: ${{ secrets.IG_KEY }}
        run: |
          python -u - <<'PY'
          import os, requests, instagram
          G = instagram.FB_API
          def show(name, t):
              d = requests.get(G + "/debug_token", params={"input_token": t, "access_token": t}, timeout=60).json()
              print(name, "->", str(d.get("data") or d)[:600])
          saved = instagram.load_token()
          user = os.environ.get("INSTAGRAM_TOKEN", "").strip()
          assert saved or user, "нет секрета INSTAGRAM_TOKEN"
          if saved and saved != user:
              show("Сохранённый ключ страницы", saved)
          if user:
              show("Ключ пользователя INSTAGRAM_TOKEN", user)
              print("Пользователь:", requests.get(G + "/me", params={"fields": "id,name", "access_token": user}, timeout=60).text[:300])
          for t in [x for x in (saved, user) if x]:
              me = requests.get(G + "/me", params={"fields": "name,instagram_business_account", "access_token": t}, timeout=60).json()
              if "instagram_business_account" not in me:
                  pages = requests.get(G + "/me/accounts", params={"fields": "name,access_token,instagram_business_account", "access_token": t}, timeout=60).json()
                  print("Страницы:", str([{k: v for k, v in p.items() if k != "access_token"} for p in pages.get("data", [])] or pages)[:400])
                  page = next((p for p in pages.get("data", []) if p.get("instagram_business_account")), None)
                  if not page:
                      continue
                  t, me = page["access_token"], page
              ig = requests.get(G + "/" + me["instagram_business_account"]["id"], params={"fields": "username", "access_token": t}, timeout=60).json()
              print("Страница:", me.get("name"), "| Instagram:", ig.get("username") or ig)
              if "username" in ig and t != saved:
                  instagram.save_token(t)
                  print("Новый ключ страницы сохранён")
              break
          else:
              raise SystemExit("Ни один ключ не дал страницу с Instagram")
          PY
      - name: Сохранить ключ
        run: |
          git config user.name "shorts-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add $(ls ig_token.enc ig_token.json 2>/dev/null) || true
          git diff --cached --quiet && exit 0
          git commit -m "Ключ Instagram (зашифрован)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
