name: Бот-портфолио

# Выкладывает бота на Cloudflare Workers при каждом изменении папки portfolio-bot
# (например, правке data.json) и при ручном запуске.
on:
  push:
    branches: [main]
    paths: ["portfolio-bot/**", ".github/workflows/portfolio-bot.yml"]
  workflow_dispatch:

concurrency:
  group: portfolio-bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portfolio-bot
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RAW_BOT_TOKEN: ${{ secrets.PORTFOLIO_BOT_TOKEN }}
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_MODE: ${{ vars.TIKTOK_MODE }}
    steps:
      - uses: actions/checkout@v5

      - name: Почистить токен бота
        run: |
          # При копировании из .env легко захватить пробел, перенос строки или «BOT_TOKEN=».
          token=$(printf '%s' "$RAW_BOT_TOKEN" | tr -d '[:space:]"' | sed 's/^BOT_TOKEN=//')
          echo "::add-mask::$token"
          echo "BOT_TOKEN=$token" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Проверить секреты
        run: |
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BOT_TOKEN; do
            if [ -z "${!s}" ]; then echo "Нет секрета $s (см. portfolio-bot/README.md)"; exit 1; fi
          done
          python3 -c "import json; json.load(open('data.json', encoding='utf-8'))" \
            || { echo "В data.json ошибка: пропущена запятая или кавычка"; exit 1; }

      - name: Память бота (Cloudflare KV)
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          id=$(curl -sS -H "$auth" "$api?per_page=100" | python3 -c \
            "import json,sys; print(next((n['id'] for n in json.load(sys.stdin)['result'] if n['title']=='portfolio-bot-state'), ''))")
          if [ -z "$id" ]; then
            id=$(curl -sS -H "$auth" -H "Content-Type: application/json" -d '{"title":"portfolio-bot-state"}' "$api" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['result']['id'])")
          fi
          sed -i "s/KV_ID/$id/" wrangler.toml

      - name: Выложить
        run: |
          # При самой первой выкладке wrangler иногда падает уже после загрузки, второй раз проходит.
          npx --yes wrangler@4.148.0 deploy || { sleep 5; npx --yes wrangler@4.148.0 deploy; }
          printf '%s' "$BOT_TOKEN" | npx --yes wrangler@4.148.0 secret put BOT_TOKEN
          # Токен GitHub для таймера, который вовремя запускает ролики и поиск заказов.
          if [ -n "$GH_DISPATCH_TOKEN" ]; then
            printf '%s' "$GH_DISPATCH_TOKEN" | tr -d '[:space:]' | npx --yes wrangler@4.148.0 secret put GH_DISPATCH_TOKEN
          else
            echo "Нет секрета GH_DISPATCH_TOKEN: таймер не запускает ролики и поиск заказов (см. portfolio-bot/README.md)"
          fi
          # Ключи приложения TikTok: вход владельца командой /tiktok (см. portfolio-bot/tiktok.js).
          for s in TIKTOK_CLIENT_KEY TIKTOK_CLIENT_SECRET TIKTOK_MODE; do
            if [ -n "${!s}" ]; then printf '%s' "${!s}" | tr -d '[:space:]' | npx --yes wrangler@4.148.0 secret put $s; fi
          done

      - name: Подключить к Telegram
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          # Адрес вида имя.workers.dev; если его ещё нет, создаём.
          sub=$(curl -sS -H "$auth" "$api/subdomain" | python3 -c \
            "import json,sys; print((json.load(sys.stdin).get('result') or {}).get('subdomain') or '')")
          if [ -z "$sub" ]; then
            sub="hazzer-$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | cut -c1-6)"
            curl -sS -X PUT -H "$auth" -H "Content-Type: application/json" -d "{\"subdomain\":\"$sub\"}" "$api/subdomain"
            echo
          fi
          curl -sS -X POST -H "$auth" -H "Content-Type: application/json" -d '{"enabled":true}' \
            "$api/scripts/portfolio-bot/subdomain"
          echo
          url="https://portfolio-bot.$sub.workers.dev"
          secret=$(printf '%s' "$BOT_TOKEN" | sha256sum | cut -c1-32)
          curl -sS "https://api.telegram.org/bot$BOT_TOKEN/setWebhook" \
            -d "url=$url" -d "secret_token=$secret" -d 'allowed_updates=["message","callback_query"]' | tee hook.json
          echo
          grep -q '"ok":true' hook.json
          echo "Бот работает: $url"
