name: Test video (no upload)

on:
  workflow_dispatch:
    inputs:
      ad:
        description: "Рекламный ролик (слот 14:00) вместо факта"
        type: boolean
        default: false
      id:
        description: "Собрать конкретный сценарий (id), например для ручной загрузки"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Голос из кэша
        id: voice
        uses: actions/cache@v5
        with:
          path: voice
          key: voice-dmitri-medium-v1
      - name: Скачать голос
        if: steps.voice.outputs.cache-hit != 'true'
        run: |
          mkdir -p voice
          curl -sSL -o v.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-ru_RU-dmitri-medium.tar.bz2
          echo "c86d0803737de13d441923ff3b3f309482fab8d7af3ec85949942809eb9a3660  v.tar.bz2" | sha256sum -c -
          tar -xjf v.tar.bz2
          cp vits-piper-ru_RU-dmitri-medium/ru_RU-dmitri-medium.onnx vits-piper-ru_RU-dmitri-medium/ru_RU-dmitri-medium.onnx.json voice/
          rm -rf v.tar.bz2 vits-piper-ru_RU-dmitri-medium
      - run: |
          if [ -n "${{ inputs.id }}" ]; then
            python -u - <<'PY'
          import json, os, engine
          sid = "${{ inputs.id }}"
          sc = next(s for s in json.load(open("scenarios.json", encoding="utf-8")) + json.load(open("ads.json", encoding="utf-8")) if s["id"] == sid)
          os.makedirs("out", exist_ok=True)
          engine.build(sc, "out/%s.mp4" % sid, "work")
          PY
          else
            python run.py --no-upload ${{ inputs.ad && '--ad' || '--fact' }} && cat log.txt
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Сохранить ролик в ветку samples
        run: |
          mkdir -p /tmp/s && cp out/*.mp4 /tmp/s/test.mp4
          git config user.name "shorts-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan samples
          git rm -rqf --cached .
          mkdir -p samples && cp /tmp/s/test.mp4 samples/
          git add samples/test.mp4
          git commit -qm "Тестовый ролик"
          git push -f origin samples
