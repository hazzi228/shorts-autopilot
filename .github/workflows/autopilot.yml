name: Shorts Autopilot

on:
  schedule:
    # Каждый час в окнах после слотов (по UTC): GitHub часто опаздывает с расписанием на час-два, поэтому run.py --check сам решает,
    # пора ли выпускать ролик (10:00, 16:00 и 22:00 по Москве). Лишние запуски заканчиваются за полминуты.
    - cron: "17 7-11,13-17,19-23 * * *"
  workflow_dispatch:
    inputs:
      refill:
        description: "Дописать новые сценарии, даже если старые не кончились"
        type: boolean
        default: false
      check:
        description: "Выпускать ролик, только если в текущем слоте его ещё не было (для внешнего таймера)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Пора ли выпускать ролик
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.check }}" = "true" ]; then python3 run.py --check; else echo "due=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v6
        if: steps.slot.outputs.due == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Библиотеки
        if: steps.slot.outputs.due == 'true'
        run: pip install -r requirements.txt

      - name: Голос из кэша
        if: steps.slot.outputs.due == 'true'
        id: voice
        uses: actions/cache@v5
        with:
          path: voice
          key: voice-dmitri-medium-v1

      - name: Скачать голос
        if: steps.slot.outputs.due == 'true' && steps.voice.outputs.cache-hit != 'true'
        run: |
          mkdir -p voice
          curl -sSL -o v.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-ru_RU-dmitri-medium.tar.bz2
          echo "c86d0803737de13d441923ff3b3f309482fab8d7af3ec85949942809eb9a3660  v.tar.bz2" | sha256sum -c -
          tar -xjf v.tar.bz2
          cp vits-piper-ru_RU-dmitri-medium/ru_RU-dmitri-medium.onnx vits-piper-ru_RU-dmitri-medium/ru_RU-dmitri-medium.onnx.json voice/
          rm -rf v.tar.bz2 vits-piper-ru_RU-dmitri-medium

      - name: Собрать и выложить ролик
        if: steps.slot.outputs.due == 'true'
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          IG_KEY: ${{ secrets.IG_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: |
          if [ -z "$YOUTUBE_TOKEN" ]; then echo "Нет секрета YOUTUBE_TOKEN (см. README)"; exit 1; fi
          printf '%s' "$YOUTUBE_TOKEN" > token.json
          python -u run.py

      - name: Пополнить сценарии (после ролика, чтобы не задерживать его)
        if: always() && steps.slot.outputs.due == 'true'
        continue-on-error: true
        timeout-minutes: 15
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u refill.py ${{ inputs.refill && '--force' || '' }}

      - name: Сохранить прогресс
        if: always() && steps.slot.outputs.due == 'true'
        run: |
          rm -f token.json
          git config user.name "shorts-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json scenarios.json log.txt $(ls ig_token.enc ig_token.json 2>/dev/null)
          git diff --cached --quiet && exit 0
          git commit -m "Ролик $(date -u +%F\ %H:%M) UTC"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

      - name: Ролик и описание (скачать можно 7 дней)
        if: always() && steps.slot.outputs.due == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: video
          path: out/
          retention-days: 7
          if-no-files-found: ignore
